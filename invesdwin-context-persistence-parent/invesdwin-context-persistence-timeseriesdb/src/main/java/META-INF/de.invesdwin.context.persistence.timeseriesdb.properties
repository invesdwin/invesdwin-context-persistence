de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.ACQUIRE_WRITE_LOCK_TIMEOUT=1 MINUTE
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.ACQUIRE_UPDATE_LOCK_TIMEOUT=5 SECONDS
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.FILE_BUFFER_CACHE_SEGMENTS_ENABLED=true
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.FILE_BUFFER_CACHE_PRELOAD_ENABLED=true
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.FILE_BUFFER_CACHE_MMAP_ENABLED=true
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.FILE_BUFFER_CACHE_MIN_SEGMENTS_COUNT=5
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.FILE_BUFFER_CACHE_MAX_SEGMENTS_COUNT=1000
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.FILE_BUFFER_CACHE_MAX_MMAP_COUNT=50
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.FILE_BUFFER_CACHE_EVICTION_TIMEOUT=1 MINUTE
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.FILE_BUFFER_CACHE_ASYNC_TIMEOUT=5 SECONDS
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.STORAGE_CACHE_EVICTION_TIMEOUT=5 MINUTES
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.STORAGE_CACHE_MAXIMUM_SIZE=1000
# this should be as long as the longest backtest can take in the system (since updates might be skipped while data is still accessed)
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.RETAIN_OBSOLETE_FILES_THRESHOLD=1 MONTH
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.RETAIN_OBSOLETE_VERSIONS_THRESHOLD=1 HOUR
# epoch reclaim (M3-cp): epoch local data files and '<versionDir>/epoch-staging/<epochId>' directories of update attempts (epochs) that are referenced by no published index generation of their key and are not owned by a heartbeat-live progress marker are swept once the attempt is older than this threshold; the sweep is submitted by the completion of an update attempt for that key and runs on the version-cleanup thread (no separate timer), so a crashed writer's garbage goes with the next attempt on the same key
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.RETAIN_OBSOLETE_EPOCHS_THRESHOLD=1 HOUR
# index-generation prune (retention): the epoch reclaim may delete a '<N>_memory.index' generation only once the retained generations provably name everything it named (coverage, not age), with a keep floor of the newest two, the key heartbeat as the in-flight guard and RETAIN_OBSOLETE_EPOCHS_THRESHOLD as the age floor. It ships DISABLED because a build whose range() answers an empty chain when the generation it latched is gone (before commit fe7a6d29, which re-resolves the newest generation present) would read a pruned store as empty, and the trading derived-store guards take 'empty' as licence to delete and rebuild the key; enable it only once every node in the fleet runs the re-resolving build.
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.INDEX_GENERATION_PRUNE_ENABLED=false
# resumable update attempts: an update attempt publishes its staged index at a completed segment boundary every this many segments (a segment is one batch flush, DEFAULT_BATCH_FLUSH_INTERVAL values), so a long backfill publishes incrementally and an attempt that dies mid-pass (a source that times out or is cancelled) leaves a readable high-water mark that the next attempt of the key continues from instead of restarting at byte space 0. Every publish writes a new index generation, so this is the trade between how much of a dead attempt has to be re-fetched and how much index rewriting a pass does.
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.UPDATE_COMMIT_SEGMENT_INTERVAL=10
# publish-then-yield (write-lock convoy): a boundary commit publishes the staged index and then RELEASES the key's table write lock, so iterators holding its read side get a window instead of freezing the writer's frontier for the whole backfill. The attempt re-acquires the write lock within this bounded wait to continue with the next batch; if readers still hold the lock past it, the attempt ENDS cleanly - every publish already landed, so the published prefix IS the resume point and the next attempt of the key continues from it with zero progress lost. Keep this shorter than ACQUIRE_WRITE_LOCK_TIMEOUT: it bounds how long a yielding writer lingers before it hands the key over to its readers.
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.UPDATE_YIELD_ACQUIRE_WRITE_LOCK_TIMEOUT=5 SECONDS
# update attempt write-lock wait (blocker-5 convoy): one update attempt waits this long for the key's table write lock before it declares the table busy and surfaces the skip-if-active-iterators verdict. It is a QUEUED wait: the zero-wait test it replaces never joined the lock queue, and on this non-fair read-write lock readers keep barging past an unqueued writer, so a store whose readers are themselves the demanders of that update was never allowed to advance (674 skips over 49 minutes in the cap-25 r7 48-cell matrix). Keep it well below ACQUIRE_WRITE_LOCK_TIMEOUT and the demand-side retry ceilings: it bounds how long a demand may park on a table another run is genuinely iterating.
de.invesdwin.context.persistence.timeseriesdb.TimeSeriesProperties.UPDATE_ATTEMPT_ACQUIRE_WRITE_LOCK_TIMEOUT=10 SECONDS
